<nav aria-label="Page navigation ">
    <ul class="pagination justify-content-center mt-5">

        <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
            <a class="page-link"
               href="?page=1{% if query %}&{{ query }}{% endif %}">
                &laquo;
            </a>
        </li>

        <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
            {% if page_obj.has_previous %}
                <a class="page-link"
                   href="?page={{ page_obj.previous_page_number }}{% if query %}&{{ query }}{% endif %}">
                    Назад
                </a>
            {% else %}
                <span class="page-link">Назад</span>
            {% endif %}
        </li>

        <li class="page-item active">
            <span class="page-link">
                {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
            {% if page_obj.has_next %}
                <a class="page-link"
                   href="?page={{ page_obj.next_page_number }}{% if query %}&{{ query }}{% endif %}">
                    Далее
                </a>
            {% else %}
                <span class="page-link">Далее</span>
            {% endif %}
        </li>

        <li class="page-item">
            <a class="page-link"
               href="?page={{ page_obj.paginator.num_pages }}{% if query %}&{{ query }}{% endif %}">
                &raquo;
            </a>
        </li>

    </ul>
</nav>
