{% extends "base.html" %}

{% block content %}

<div class="container mt-3">
    <div class="page-header d-flex justify-content-between align-items-center my-4 p-3">
        <h1>Задачи</h1>
        <form class="d-flex" action="" method="GET">
            {{ search_form }}
            <button class="btn btn-sm btn-outline-primary" type="submit">Поиск</button>
        </form>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4 shadow py-5">
        {% for t in task %}
            <div class="col">
                <div class="card h-100 shadow">
                    <div class="card-body d-flex flex-column ">

                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title">{{ t.summary }}</h5>

                            <div class="d-flex gap-2 flex-nowrap ms-2">
                                <a class="btn btn-warning btn-sm text-nowrap" href="{% url 'update_task' t.id %}">Update</a>
                                <a class="btn btn-danger btn-sm text-nowrap" href="{% url 'delete_task' t.id %}">Delete</a>
                            </div>
                        </div>

                        <p>Проект : {{ t.project.title }}</p>
                        <p class="card-text flex-grow-1">{{ t.description|linebreaks }}</p>

                        <div>
                            <a class="card-link btn btn-outline-success" href="{% url 'detail' t.id %}">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

    {% if is_paginated %}
        {% include 'partial/pagination.html' %}
    {% endif %}
</div>
{% endblock %}
